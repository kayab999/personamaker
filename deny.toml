# cargo-deny configuration (sweep W3). Advisories are owned by the
# `cargo audit` gate (see audit.toml); deny enforces licenses, bans, sources.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

# NOTE: no [advisories] section — advisories are owned by the `cargo audit`
# gate (see audit.toml) to avoid double-fail drift between the two tools.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # MPL-2.0 (weak copyleft, file-level): acceptable for a desktop binary.
    # Linking unmodified MPL crates does not trigger source-sharing duties.
    "MPL-2.0",
    # Unlicense (public-domain dedication): acceptable; no duties.
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Pinned rationale: duplicates that cannot be unified stay warn-level until
# an upstream fix lands.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
