[package]
name = "localpersona-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# ndjson_parse target calls serde_json::from_slice directly for Value coverage.
serde_json = "1"

[dependencies.localpersona]
path = ".."

[[bin]]
name = "gguf_parse"
path = "fuzz_targets/gguf_parse.rs"
test = false
doc = false

[[bin]]
name = "ndjson_parse"
path = "fuzz_targets/ndjson_parse.rs"
test = false
doc = false

[[bin]]
name = "pdf_ingest"
path = "fuzz_targets/pdf_ingest.rs"
test = false
doc = false
