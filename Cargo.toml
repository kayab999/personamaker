[package]
name = "localpersona"
version = "0.9.0-rc.1"
description = "Local GGUF persona studio — create and chat with rich AI characters offline"
authors = ["LocalPersona Contributors"]
license = "MIT"
edition = "2021"
readme = "README.md"
keywords = ["ai", "gguf", "persona", "llama", "local"]
categories = ["multimedia", "gui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools only via optional feature (not default for commercial release builds)
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
which = "6"
regex = "1"
portpicker = "0.1"

# File system + Dialog support for proper avatar storage and export/import
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
pdf = "0.9"   # For PDF text extraction in RAG knowledge base
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
infer = "0.16"
tempfile = "3"
fastembed = "5.14.0"
open = "5"
fs2 = "0.4"
once_cell = "1"
dirs = "5"
sysinfo = "0.33"
pdf-extract = "0.7"
futures = "0.3.32"

[dev-dependencies]
tempfile = "3"
assert_fs = "1.1"
tokio-test = "0.4"
proptest = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enable with: cargo tauri dev --features devtools
devtools = ["tauri/devtools"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
# P0-3: unwind (not abort) so panics in PDF/embed parsers run Drop (server cleanup)
# and can be caught per-document instead of killing the whole app.
panic = "unwind"
